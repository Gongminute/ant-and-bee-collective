<!DOCTYPE html>
<html lang="en">
<head>
    <title>Writings Archive</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="/images/signature_gongmin.png?v=2?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=Bagel+Fat+One&family=Dokdo&family=Dongle&family=East+Sea+Dokdo&family=Gaegu&family=Gamja+Flower&family=Gasoek+One&family=Gothic+A1&family=Gowun+Batang&family=Grandiflora+One&family=Gugi&family=Hahmlet:wght@100..900&family=Jua&family=Kirang+Haerang&family=Moirai+One&family=Nanum+Brush+Script&family=Nanum+Gothic&family=Nanum+Gothic+Coding&family=Nanum+Myeongjo&family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&family=Song+Myung&family=Sunflower:wght@300&family=Yeon+Sung&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
    <style>
        :root {
            --bg: #00441B;
            --paper: #f8f6f2;
            --paper-deep: #efeae0;
            --ink: #1b1b1b;
            --shadow: 0 2px 7px rgba(38, 29, 20, 0.10);
            --edge: rgba(255, 255, 255, 0.12);
            --card-width: 164px;
            --card-height: 236px;
            --card-count: 4;
            --collapsed-step: 28px;
            --expanded-step: 28px;
            --slant-step: 15px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.08), transparent 28%),
                radial-gradient(circle at 88% 80%, rgba(255, 255, 255, 0.06), transparent 32%),
                var(--bg);
            color: var(--ink);
            font-family: "Noto Serif KR", "Iowan Old Style", "Century", serif;
        }

        main {
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem 6rem;
            position: relative;
        }

        .tag-toolbar {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 0.2rem;
            z-index: 40;
        }

        .featured-tag-toolbar {
            left: 1rem;
            right: auto;
            top: 1rem;
            bottom: auto;
            align-items: flex-start;
            flex-direction: row;
            justify-content: flex-start;
            gap: 0.55rem;
        }

        .toolbar-right {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.2rem;
        }

        .tag-filter-btn {
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.82);
            padding: 0;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-transform: lowercase;
            cursor: pointer;
            line-height: 1.2;
        }

        .tag-filter-btn.is-utility,
        .tag-filter-btn.is-active,
        .tag-filter-btn.is-ant-hill,
        .tag-filter-btn.is-ant-hill.is-active {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.92);
        }

        #tunnel-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: visible;
        }

        #tunnel-svg path {
            fill: none;
            stroke: #c0c0c0;
            stroke-width: 0.5;
            stroke-linecap: round;
        }

        #tunnel-svg .ant-dot {
            fill: #000;
            shape-rendering: crispEdges;
        }

        .thumb-grid {
            list-style: none;
            margin: 0;
            padding: 0;
            width: min(1200px, 100%);
            min-height: 115vh;
            position: relative;
            margin-left: auto;
            margin-right: auto;
            background: transparent;
            overflow: visible;
        }

        .thumb-item {
            position: absolute;
            top: 0;
            left: 0;
            width: var(--card-width);
            list-style: none;
            transform: translate3d(var(--x, 0px), var(--y, 0px), 0) rotate(var(--r, 0deg));
            transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0ms), z-index 120ms linear;
            cursor: grab;
        }

        .thumb-item.is-dragging {
            cursor: grabbing;
            transition: none;
        }

        .thumb-item.is-stacked {
            transform: translate3d(var(--stack-x, 0px), var(--stack-y, 0px), 0) rotate(0deg);
        }

        .thumb-card {
            display: flex;
            flex-direction: column;
            width: var(--card-width);
            min-height: var(--card-height);
            text-decoration: none;
            color: inherit;
            background: #f9f7f3;
            border: 1px solid rgba(86, 69, 45, 0.10);
            box-shadow: 0 2px 6px rgba(38, 29, 20, 0.08);
            padding: 0.72rem 0.68rem 0.74rem;
            transition: transform 260ms ease, box-shadow 260ms ease;
            will-change: transform;
        }

        .thumb-card[data-tags*="poetry" i] {
            font-family: "Nanum Myeongjo", "Century", serif;
        }

        .thumb-card[data-tags*="notes" i],
        .thumb-card[data-tags*="translation" i] {
            font-family: "Noto Sans KR", "Noto Sans Korean", sans-serif;
        }

        .thumb-card.is-image-only {
            padding: 0;
            overflow: hidden;
        }

        .thumb-cover {
            display: block;
            width: 100%;
            height: var(--card-height);
            object-fit: cover;
            object-position: center;
            border: 0;
        }

        .thumb-grid.is-grouped .thumb-card:hover,
        .thumb-grid.is-grouped .thumb-card:focus-visible {
            transform: translateY(-18px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            outline: none;
        }

        .thumb-title {
            margin: 0 0 0.55rem;
            font-size: 0.76rem;
            line-height: 1.25;
            font-weight: 600;
            letter-spacing: 0.01em;
            order: 1;
        }

        .thumb-title.is-hidden {
            display: none;
        }

        .thumb-byline {
            margin: 0 0 0.42rem;
            font-size: 0.62rem;
            line-height: 1.25;
            color: rgba(0, 0, 0, 0.64);
            order: 2;
        }

        .thumb-byline.is-hidden {
            display: none;
        }

        .thumb-tags {
            display: flex;
            gap: 0.28rem;
            flex-wrap: wrap;
            margin: 0;
            margin-top: auto;
            order: 4;
        }

        .tag-pill {
            border: 1px solid rgba(0, 0, 0, 0.2);
            padding: 0.08rem 0.34rem;
            font-size: 0.6rem;
            line-height: 1.2;
            background: rgba(255, 255, 255, 0.85);
        }

        .thumb-preview {
            margin: 0;
            font-size: 0.67rem;
            line-height: 1.45;
            color: rgba(0, 0, 0, 0.84);
            display: -webkit-box;
            line-clamp: 9;
            -webkit-line-clamp: 9;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 8.4em;
            order: 3;
        }

        .stack-label {
            position: absolute;
            transform: translate3d(var(--label-x, 0px), var(--label-y, 0px), 0);
            background: #1f3d2f;
            color: #fff;
            border: 1px solid #1f3d2f;
            padding: 0.14rem 0.48rem;
            font-size: 0.72rem;
            line-height: 1.2;
            z-index: 5000;
        }

        .content-modal {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 9999;
        }

        .content-modal.is-open {
            display: block;
        }

        .content-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
        }

        .content-modal-panel {
            position: relative;
            z-index: 1;
            width: min(92vw, 980px);
            height: min(88vh, 780px);
            margin: 4vh auto;
            background: #f8f6f2;
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .content-modal-close {
            position: absolute;
            top: 0.7rem;
            right: 0.8rem;
            z-index: 2;
            border: none;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .content-modal-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
        }
    </style>
</head>
<body>
    <main>
        <div id="featured-tag-toolbar" class="tag-toolbar featured-tag-toolbar"></div>
        <div id="tag-toolbar" class="tag-toolbar"></div>
        <ul class="thumb-grid">
            <li class="thumb-item" style="--index: 0; z-index: 1;">
                <a class="thumb-card is-image-only" href="writings/writing-8.html" data-source="writings/writing-8.html" data-tags="" data-author="Unknown" data-id="8" data-image-only="1">
                    <img class="thumb-cover" src="/images/082fd5e7ee1dca9e.webp" alt="Image 8" loading="lazy" />

            </li>
            <li class="thumb-item" style="--index: 1; z-index: 2;">
                <a class="thumb-card is-image-only" href="writings/writing-9.html" data-source="writings/writing-9.html" data-tags="poetry" data-author="Unknown" data-id="9" data-image-only="1">
                    <img class="thumb-cover" src="/images/521f3ed6c2d00c43.PNG" alt="Image 9" loading="lazy" />
                </a>
            </li>
            <li class="thumb-item" style="--index: 2; z-index: 3;">
                <a class="thumb-card" href="writings/writing-10.html" data-source="writings/writing-10.html" data-tags="notes|translation|by:Gongmin" data-author="Gongmin" data-id="10">
                    <h2 class="thumb-title">4/2</h2>
                    <p class="thumb-byline">by Gongmin</p>

                    <h2 class="thumb-title">Korean Literature Now Vol.73</h2>

    <div id="content-modal" class="content-modal" aria-hidden="true">
        <div class="content-modal-backdrop" data-close="true"></div>
        <div class="content-modal-panel">
            <button type="button" class="content-modal-close" aria-label="Close writing" data-close="true">×</button>
            <iframe id="content-modal-frame" class="content-modal-frame" title="Writing content"></iframe>
        </div>
    </div>

    <script>
        const cards = Array.from(document.querySelectorAll('.thumb-card'));
        const cardItems = Array.from(document.querySelectorAll('.thumb-item'));
        const modal = document.getElementById('content-modal');
        const modalFrame = document.getElementById('content-modal-frame');
        const featuredToolbar = document.getElementById('featured-tag-toolbar');
        const toolbar = document.getElementById('tag-toolbar');
        const rootGrid = document.querySelector('.thumb-grid');
        const activeTags = new Set();
        const randomPositions = new Map();
        const LAYOUT_STORAGE_KEY = 'writings-random-layout-v2';
        let antHillActive = false;
        let showTitles = false;
        let tunnelRafId = null;
        let dragState = null;
        let suppressClickUntil = 0;

        function applyCardMetaVisibility() {
            cards.forEach((card) => {
                const title = card.querySelector('.thumb-title');
                const byline = card.querySelector('.thumb-byline');

                if (title) {
                    title.classList.toggle('is-hidden', !showTitles);
                }

                if (byline) {
                    byline.classList.add('is-hidden');
                }
            });
        }

        function startTunnelLoop() {
            clearTunnels();
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.id = 'tunnel-svg';
            rootGrid.insertBefore(svg, rootGrid.firstChild);

            const visible = cardItems.filter((item) => item.style.display !== 'none');
            const pairs = [];
            for (let i = 0; i < visible.length - 1; i++) {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                svg.appendChild(path);
                pairs.push({ path, a: visible[i], b: visible[i + 1] });
            }

            const ants = [];
            pairs.forEach(({ path }) => {
                const antCount = 1 + Math.floor(Math.random() * 4);
                for (let i = 0; i < antCount; i += 1) {
                    const ant = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    ant.setAttribute('class', 'ant-dot');
                    ant.setAttribute('width', '2');
                    ant.setAttribute('height', '2');
                    svg.appendChild(ant);
                    ants.push({
                        node: ant,
                        path,
                        travel: Math.random(),
                        speed: 13 + Math.random() * 18,
                        direction: Math.random() < 0.35 ? -1 : 1,
                        moveRemaining: 0.8 + Math.random() * 1.6,
                        pauseRemaining: 0,
                        pauseChance: 0.12 + Math.random() * 0.16,
                        turnRemaining: 0.7 + Math.random() * 2.3,
                        turnChance: 0.06 + Math.random() * 0.14,
                        jitterPhase: Math.random() * Math.PI * 2,
                        jitterSpeed: 6 + Math.random() * 5,
                        jitterAmp: 0.25 + Math.random() * 0.65
                    });
                }
            });

            let lastTime = null;

            function frame(timestamp) {
                if (lastTime === null) {
                    lastTime = timestamp;
                }
                const dt = Math.max(0, (timestamp - lastTime) / 1000);
                lastTime = timestamp;

                const gridRect = rootGrid.getBoundingClientRect();
                svg.setAttribute('viewBox', `0 0 ${gridRect.width} ${gridRect.height}`);
                svg.style.width = gridRect.width + 'px';
                svg.style.height = gridRect.height + 'px';

                pairs.forEach(({ path, a, b }) => {
                    const ra = a.getBoundingClientRect();
                    const rb = b.getBoundingClientRect();
                    const ax = ra.left - gridRect.left + ra.width / 2;
                    const ay = ra.top - gridRect.top + ra.height / 2;
                    const bx = rb.left - gridRect.left + rb.width / 2;
                    const by = rb.top - gridRect.top + rb.height / 2;
                    const midX = (ax + bx) / 2;
                    const dist = Math.hypot(bx - ax, by - ay);
                    const sag = dist * 0.38;
                    const cpY = Math.max(ay, by) + sag;
                    path.setAttribute('d', `M ${ax} ${ay} Q ${midX} ${cpY} ${bx} ${by}`);
                });

                ants.forEach((antData) => {
                    const pathLength = antData.path.getTotalLength();
                    if (!Number.isFinite(pathLength) || pathLength < 1) {
                        antData.node.setAttribute('visibility', 'hidden');
                        return;
                    }

                    antData.node.setAttribute('visibility', 'visible');
                    if (antData.pauseRemaining > 0) {
                        antData.pauseRemaining -= dt;
                        if (antData.pauseRemaining <= 0) {
                            antData.moveRemaining = 0.7 + Math.random() * 1.7;
                            antData.turnRemaining = Math.min(antData.turnRemaining, 0.35 + Math.random() * 0.75);
                        }
                    } else {
                        antData.turnRemaining -= dt;
                        if (antData.turnRemaining <= 0) {
                            if (Math.random() < antData.turnChance) {
                                antData.direction *= -1;
                            }
                            antData.turnRemaining = 0.7 + Math.random() * 2.3;
                        }

                        const delta = ((antData.speed * dt) / pathLength) * antData.direction;
                        antData.travel = (antData.travel + delta + 1) % 1;
                        antData.moveRemaining -= dt;
                        if (antData.moveRemaining <= 0) {
                            if (Math.random() < antData.pauseChance) {
                                antData.pauseRemaining = 0.15 + Math.random() * 0.55;
                            } else {
                                antData.moveRemaining = 0.9 + Math.random() * 1.9;
                            }
                        }
                    }

                    const point = antData.path.getPointAtLength(antData.travel * pathLength);
                    antData.jitterPhase += dt * antData.jitterSpeed;
                    const jitter = Math.sin(antData.jitterPhase) * antData.jitterAmp;
                    antData.node.setAttribute('x', String(Math.round(point.x + jitter)));
                    antData.node.setAttribute('y', String(Math.round(point.y - jitter)));
                });

                tunnelRafId = requestAnimationFrame(frame);
            }

            tunnelRafId = requestAnimationFrame(frame);
        }

        function clearTunnels() {
            if (tunnelRafId !== null) {
                cancelAnimationFrame(tunnelRafId);
                tunnelRafId = null;
            }
            const existing = document.getElementById('tunnel-svg');
            if (existing) existing.remove();
        }

        function getCurrentItemPosition(item) {
            const x = parseFloat(item.style.getPropertyValue('--x')) || 0;
            const y = parseFloat(item.style.getPropertyValue('--y')) || 0;
            return { x, y };
        }

        function beginDrag(event, item) {
            if (activeTags.size > 0) {
                return;
            }

            if (event.pointerType === 'mouse' && event.button !== 0) {
                return;
            }

            const pos = getCurrentItemPosition(item);
            const gridRect = rootGrid.getBoundingClientRect();
            const startX = event.clientX - gridRect.left;
            const startY = event.clientY - gridRect.top;

            dragState = {
                item,
                pointerId: event.pointerId,
                startX,
                startY,
                offsetX: startX - pos.x,
                offsetY: startY - pos.y,
                moved: false
            };

            item.classList.add('is-dragging');
            item.style.zIndex = '7000';

            if (item.setPointerCapture) {
                try {
                    item.setPointerCapture(event.pointerId);
                } catch (error) {
                    // Ignore capture errors on unsupported browsers.
                }
            }

            event.preventDefault();
        }

        function onDragMove(event) {
            if (!dragState || event.pointerId !== dragState.pointerId) {
                return;
            }

            const gridRect = rootGrid.getBoundingClientRect();
            const cardWidth = 164;
            const cardHeight = 236;
            const maxX = Math.max(10, gridRect.width - cardWidth - 10);
            const maxY = Math.max(10, gridRect.height - cardHeight - 10);

            const rawX = event.clientX - gridRect.left - dragState.offsetX;
            const rawY = event.clientY - gridRect.top - dragState.offsetY;
            const x = clamp(Math.round(rawX), 10, maxX);
            const y = clamp(Math.round(rawY), 10, maxY);

            const movedDistance = Math.hypot(event.clientX - (dragState.startX + gridRect.left), event.clientY - (dragState.startY + gridRect.top));
            if (movedDistance > 3) {
                dragState.moved = true;
            }

            dragState.item.style.setProperty('--x', `${x}px`);
            dragState.item.style.setProperty('--y', `${y}px`);
            dragState.item.style.setProperty('--r', '0deg');

            const existing = randomPositions.get(dragState.item) || {};
            randomPositions.set(dragState.item, {
                ...existing,
                x,
                y,
                r: '0deg'
            });

            event.preventDefault();
        }

        function endDrag(event) {
            if (!dragState || event.pointerId !== dragState.pointerId) {
                return;
            }

            const item = dragState.item;
            const moved = dragState.moved;
            item.classList.remove('is-dragging');

            if (item.releasePointerCapture) {
                try {
                    item.releasePointerCapture(event.pointerId);
                } catch (error) {
                    // Ignore release errors on unsupported browsers.
                }
            }

            if (moved) {
                suppressClickUntil = Date.now() + 220;
            } else {
                const link = item.querySelector('.thumb-card[href]');
                if (link && link.getAttribute('href')) {
                    if (!(event.metaKey || event.ctrlKey)) {
                        event.preventDefault();
                        openWritingInModal(link.href);
                    }
                }
            }

            persistLayout(rootGrid.clientWidth, parseFloat(rootGrid.style.minHeight) || rootGrid.clientHeight);
            dragState = null;
            event.preventDefault();
        }

        function openWritingInModal(url) {
            if (!modal || !modalFrame) {
                return;
            }

            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
            modalFrame.src = url;
        }

        function closeWritingModal() {
            if (!modal || !modalFrame) {
                return;
            }

            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
            modalFrame.removeAttribute('src');
        }

        function setupDragging() {
            cardItems.forEach((item) => {
                item.addEventListener('pointerdown', (event) => beginDrag(event, item));
            });

            cards.forEach((card) => {
                card.addEventListener('click', (event) => {
                    const link = card.getAttribute('href');
                    if (!link) {
                        return;
                    }

                    if (event.metaKey || event.ctrlKey) {
                        return;
                    }

                    event.preventDefault();
                    openWritingInModal(link);
                });
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modal && modal.classList.contains('is-open')) {
                    closeWritingModal();
                }
            });

            if (modal) {
                modal.addEventListener('click', (event) => {
                    if (event.target instanceof HTMLElement && event.target.dataset.close === 'true') {
                        closeWritingModal();
                    }
                });
            }

            window.addEventListener('pointermove', onDragMove);
            window.addEventListener('pointerup', endDrag);
            window.addEventListener('pointercancel', endDrag);

            rootGrid.addEventListener('click', (event) => {
                if (Date.now() < suppressClickUntil) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            }, true);
        }

        function cleanPreviewText(rawText) {
            return rawText
                .replace(/<!\[CDATA\[/gi, ' ')
                .replace(/]]>/g, ' ')
                .replace(/\s+/g, ' ')
                .replace(/[\r\n]+/g, ' ')
                .trim();
        }

        function extractPreviewText(doc) {
            const bodyClone = doc.body ? doc.body.cloneNode(true) : null;

            if (!bodyClone) {
                return '';
            }

            bodyClone.querySelectorAll('script, style, noscript, template, svg').forEach((node) => {
                node.remove();
            });

            const textChunks = Array.from(bodyClone.querySelectorAll('h1, h2, h3, p, li, blockquote'))
                .map((node) => cleanPreviewText(node.textContent || ''))
                .filter(Boolean);

            if (textChunks.length > 0) {
                return textChunks.join(' ');
            }

            return cleanPreviewText(bodyClone.textContent || '');
        }

        function extractImageSource(doc) {
            const meta = doc.getElementById('writing-meta');
            if (meta) {
                try {
                    const payload = JSON.parse(meta.textContent || '{}');
                    if (payload && typeof payload.image === 'string' && payload.image.trim()) {
                        return payload.image.trim();
                    }
                } catch (error) {
                    // Ignore malformed JSON and fall through to DOM probing.
                }
            }

            const heroImage = doc.querySelector('img.hero-image, img[alt], main img');
            return heroImage ? heroImage.getAttribute('src') || '' : '';
        }

        function setCardToImageOnly(card, imageSrc) {
            if (!imageSrc) {
                return;
            }

            card.classList.add('is-image-only');
            card.dataset.imageOnly = '1';
            card.innerHTML = `<img class="thumb-cover" src="${imageSrc}" alt="${card.getAttribute('data-source') || 'Writing cover'}" loading="lazy" />`;
        }

        async function hydrateCardPreview(card) {
            const preview = card.querySelector('.thumb-preview');
            const title = card.querySelector('.thumb-title');
            const source = card.getAttribute('data-source');

            if (card.classList.contains('is-image-only') || card.dataset.imageOnly === '1') {
                if (!card.querySelector('.thumb-cover')) {
                    const existingImage = card.querySelector('img');
                    if (existingImage) {
                        existingImage.classList.add('thumb-cover');
                    }
                }
                return;
            }

            if (!preview) {
                return;
            }

            try {
                const response = await fetch(source);
                if (!response.ok) {
                    throw new Error('preview fetch failed');
                }

                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const bodyText = extractPreviewText(doc);
                const pageTitle = cleanPreviewText(doc.title || '');
                const imageSrc = extractImageSource(doc);

                if (imageSrc && bodyText) {
                    setCardToImageOnly(card, imageSrc);
                    return;
                }

                if (pageTitle && title && title.textContent.startsWith('Writing Title')) {
                    title.textContent = pageTitle;
                }

                preview.textContent = bodyText || 'Preview will appear once this page has text content.';
            } catch (error) {
                preview.textContent = 'Preview unavailable in this browser context. Click to open the writing.';
            }
        }

        function parseTags(card) {
            const tags = (card.dataset.tags || '')
                .split('|')
                .map((tag) => tag.trim())
                .filter(Boolean);

            const author = (card.dataset.author || '').trim();
            if (author) {
                tags.push(`by:${author}`);
            }

            return Array.from(new Set(tags));
        }

        function allTags() {
            const set = new Set();
            cards.forEach((card) => {
                parseTags(card).forEach((tag) => set.add(tag));
            });
            return Array.from(set).sort((a, b) => a.localeCompare(b));
        }

        function formatTagLabel(tag) {
            if (typeof tag === 'string' && tag.toLowerCase().startsWith('by:')) {
                const author = tag.slice(3).trim();
                return author ? `@${author}` : '@author';
            }

            return `${tag}`;
        }

        function clearStackLabels() {
            rootGrid.querySelectorAll('.stack-label').forEach((node) => node.remove());
        }

        function randomBetween(min, max) {
            return Math.random() * (max - min) + min;
        }

        function getCardId(item, index) {
            const card = item.querySelector('.thumb-card');
            return card && card.dataset.id ? card.dataset.id : String(index + 1);
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function isOverlapping(rect, existingRects, spacing) {
            return existingRects.some((other) => {
                const separated =
                    rect.x + rect.width + spacing <= other.x ||
                    other.x + other.width + spacing <= rect.x ||
                    rect.y + rect.height + spacing <= other.y ||
                    other.y + other.height + spacing <= rect.y;
                return !separated;
            });
        }

        function createCollisionAwarePosition(existingRects, width, height, cardWidth, cardHeight) {
            const maxX = Math.max(10, width - cardWidth - 10);
            const maxY = Math.max(10, height - cardHeight - 10);
            const spacing = 22;

            for (let attempt = 0; attempt < 160; attempt += 1) {
                const x = Math.round(randomBetween(10, maxX));
                const y = Math.round(randomBetween(10, maxY));
                const candidate = { x, y, width: cardWidth, height: cardHeight };
                if (!isOverlapping(candidate, existingRects, spacing)) {
                    return {
                        x,
                        y,
                        r: '0deg'
                    };
                }
            }

            return {
                x: Math.round(randomBetween(10, maxX)),
                y: Math.round(randomBetween(10, maxY)),
                r: '0deg'
            };
        }

        function loadStoredLayout(width, height) {
            try {
                const raw = localStorage.getItem(LAYOUT_STORAGE_KEY);
                if (!raw) {
                    return null;
                }

                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || !parsed.items) {
                    return null;
                }

                const widthDelta = Math.abs((parsed.width || 0) - width);
                const heightDelta = Math.abs((parsed.height || 0) - height);
                if (widthDelta > 160 || heightDelta > 160) {
                    return null;
                }

                return parsed.items;
            } catch (error) {
                return null;
            }
        }

        function persistLayout(width, height) {
            const items = {};
            randomPositions.forEach((value) => {
                items[value.id] = {
                    x: value.x,
                    y: value.y,
                    r: value.r
                };
            });

            try {
                localStorage.setItem(LAYOUT_STORAGE_KEY, JSON.stringify({
                    width,
                    height,
                    items
                }));
            } catch (error) {
                // Ignore storage errors in private browsing or locked storage contexts.
            }
        }

        function buildRandomLayout() {
            const width = rootGrid.clientWidth;
            const cardWidth = 164;
            const cardHeight = 236;
            const estimatedColumns = Math.max(1, Math.floor(width / (cardWidth + 52)));
            const estimatedRows = Math.max(1, Math.ceil(cardItems.length / estimatedColumns));
            const rowStride = cardHeight + 120;
            const contentHeight = (estimatedRows * rowStride) + 260;
            const height = Math.max(window.innerHeight * 1.8, contentHeight, 1200);
            const existingRects = [];

            cardItems.forEach((item, index) => {
                const id = getCardId(item, index);
                const position = createCollisionAwarePosition(existingRects, width, height, cardWidth, cardHeight);

                existingRects.push({ x: position.x, y: position.y, width: cardWidth, height: cardHeight });
                randomPositions.set(item, { ...position, id, index });
            });

            rootGrid.style.minHeight = `${Math.round(height)}px`;
        }

        function createStackLabel(tag, x, y) {
            const label = document.createElement('div');
            label.className = 'stack-label';
            label.textContent = formatTagLabel(tag);
            label.style.setProperty('--label-x', `${x}px`);
            label.style.setProperty('--label-y', `${Math.max(y - 26, 4)}px`);
            rootGrid.appendChild(label);
        }

        function applyLayout() {
            clearStackLabels();

            const selectedTags = Array.from(activeTags);
            rootGrid.classList.toggle('is-grouped', selectedTags.length > 0);
            const width = rootGrid.clientWidth;
            const stackCount = Math.max(selectedTags.length, 1);
            const stackBandWidth = Math.max(220, Math.floor((width - 40) / stackCount));
            const stackStartY = 48;

            const stackMembersByTag = new Map();
            selectedTags.forEach((tag) => stackMembersByTag.set(tag, []));

            cardItems.forEach((item) => {
                const card = item.querySelector('.thumb-card');
                if (!card) {
                    return;
                }

                const tags = parseTags(card);
                const stackTag = selectedTags.find((tag) => tags.includes(tag));
                if (!stackTag) {
                    return;
                }

                stackMembersByTag.get(stackTag).push(item);
            });

            cardItems.forEach((item) => {
                const randomData = randomPositions.get(item);
                if (!randomData) {
                    return;
                }

                item.classList.remove('is-stacked');
                item.style.setProperty('--delay', '0ms');
                item.style.zIndex = String(100 + randomData.index);
                item.style.setProperty('--x', `${randomData.x}px`);
                item.style.setProperty('--y', `${randomData.y}px`);
                item.style.setProperty('--r', randomData.r);
            });

            selectedTags.forEach((tag, stackIndex) => {
                const members = stackMembersByTag.get(tag) || [];
                const anchorX = 20 + stackIndex * stackBandWidth + Math.max(0, Math.floor((stackBandWidth - 164) / 2));
                createStackLabel(tag, anchorX, stackStartY);

                members.forEach((item, memberIndex) => {
                    item.classList.add('is-stacked');
                    item.style.setProperty('--delay', `${memberIndex * 60}ms`);
                    item.style.setProperty('--stack-x', `${anchorX}px`);
                    item.style.setProperty('--stack-y', `${stackStartY + (memberIndex * 18)}px`);
                    item.style.zIndex = String(3000 + memberIndex + (stackIndex * 50));
                });
            });

            if (selectedTags.length > 0) {
                const groupedSet = new Set();
                selectedTags.forEach((tag) => {
                    (stackMembersByTag.get(tag) || []).forEach((item) => groupedSet.add(item));
                });

                const ungrouped = cardItems.filter((item) => !groupedSet.has(item));
                const belowY = stackStartY + 360;

                ungrouped.forEach((item, index) => {
                    const x = 26 + (index * 34);
                    item.classList.add('is-stacked');
                    item.style.setProperty('--delay', `${index * 40}ms`);
                    item.style.setProperty('--stack-x', `${x}px`);
                    item.style.setProperty('--stack-y', `${belowY}px`);
                    item.style.zIndex = String(2200 + index);
                });
            }
        }

        function renderFeaturedTagToolbar() {
            const tags = allTags();
            const featuredTags = ['translation', 'novel', 'poetry'];
            const featured = featuredTags.filter((tag) => tags.includes(tag));

            if (!featured.length) {
                featuredToolbar.innerHTML = '';
                return;
            }

            featuredToolbar.innerHTML = featured.map((tag) => {
                const activeClass = activeTags.has(tag) ? ' is-active' : '';
                return `<button type="button" class="tag-filter-btn${activeClass}" data-tag="${tag}">${formatTagLabel(tag)}</button>`;
            }).join('');

            featuredToolbar.querySelectorAll('.tag-filter-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const tag = button.getAttribute('data-tag');
                    if (!tag) {
                        return;
                    }

                    if (activeTags.has(tag)) {
                        activeTags.delete(tag);
                    } else {
                        activeTags.add(tag);
                    }

                    renderTagToolbar();
                    renderFeaturedTagToolbar();
                    applyLayout();
                });
            });
        }

        function renderTagToolbar() {
            const tags = allTags();
            const remainingTags = tags.filter((tag) => !['translation', 'novel', 'poetry'].includes(tag));

            if (!remainingTags.length) {
                toolbar.innerHTML = '';
                return;
            }

            toolbar.innerHTML = remainingTags.map((tag) => {
                const activeClass = activeTags.has(tag) ? ' is-active' : '';
                return `<button type="button" class="tag-filter-btn${activeClass}" data-tag="${tag}">${formatTagLabel(tag)}</button>`;
            }).join('') +
                '<span class="toolbar-right">' +
                `<button type="button" class="tag-filter-btn is-ant-hill${antHillActive ? ' is-active' : ''}" data-action="ant-hill">ant hill</button>` +
                '<button type="button" class="tag-filter-btn is-utility" data-action="reshuffle">bee dance</button>' +
                '</span>';

            toolbar.querySelectorAll('.tag-filter-btn').forEach((button) => {
                const action = button.getAttribute('data-action');
                if (action === 'ant-hill') {
                    button.addEventListener('click', () => {
                        antHillActive = !antHillActive;
                        if (antHillActive) { startTunnelLoop(); } else { clearTunnels(); }
                        renderTagToolbar();
                    });
                    return;
                }
                if (action === 'reshuffle') {
                    button.addEventListener('click', () => {
                        localStorage.removeItem(LAYOUT_STORAGE_KEY);
                        randomPositions.clear();
                        buildRandomLayout();
                        applyLayout();
                    });
                    return;
                }

                button.addEventListener('click', () => {
                    const tag = button.getAttribute('data-tag');
                    if (!tag) {
                        return;
                    }

                    if (activeTags.has(tag)) {
                        activeTags.delete(tag);
                    } else {
                        activeTags.add(tag);
                    }

                    renderTagToolbar();
                    renderFeaturedTagToolbar();
                    applyLayout();
                });
            });
        }

        buildRandomLayout();

        cards.forEach((card) => {
            hydrateCardPreview(card);
        });

        applyCardMetaVisibility();
        renderFeaturedTagToolbar();
        renderTagToolbar();
        applyLayout();
        setupDragging();

        window.addEventListener('resize', () => {
            buildRandomLayout();
            applyLayout();
        });
    </script>
</body>
</html>
