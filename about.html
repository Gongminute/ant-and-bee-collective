<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="/images/signature_gongmin.png?v=2?v=2">
<title>About</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=Bagel+Fat+One&family=Dokdo&family=Dongle&family=East+Sea+Dokdo&family=Gaegu&family=Gamja+Flower&family=Gasoek+One&family=Gothic+A1&family=Gowun+Batang&family=Grandiflora+One&family=Gugi&family=Hahmlet:wght@100..900&family=Jua&family=Kirang+Haerang&family=Moirai+One&family=Nanum+Brush+Script&family=Nanum+Gothic&family=Nanum+Gothic+Coding&family=Nanum+Myeongjo&family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&family=Song+Myung&family=Sunflower:wght@300&family=Yeon+Sung&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #e8e9ec;
            font-family: 'Noto Serif KR', serif;
            font-size: 16px;
            line-height: 1.6;
            color: #1f2940;
            overflow-x: hidden;
        }

        .library-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero {
            min-height: 48vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 20px 28px;
        }

        .hero h1 {
            font-size: clamp(44px, 8vw, 72px);
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .hero p {
            max-width: 980px;
            font-size: clamp(24px, 3.5vw, 52px);
            line-height: 1.18;
            font-weight: 400;
        }

        .divider {
            width: 100%;
            border: none;
            border-top: 1px solid rgba(31, 41, 64, 0.4);
        }

        .library-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 52px 20px 24px;
            text-align: center;
        }

        .library-controls h2 {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: clamp(20px, 2.4vw, 42px);
            letter-spacing: 0.04em;
            font-weight: 600;
            text-transform: uppercase;
            color: #2d3448;
        }

        .topic-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: min(1100px, 100%);
        }

        .topic-chip {
            border: 1px solid #1f2940;
            border-radius: 999px;
            background: transparent;
            color: #1f2940;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: clamp(14px, 1.5vw, 26px);
            line-height: 1;
            padding: 10px 18px;
            cursor: pointer;
            transition: background-color 160ms ease, color 160ms ease;
        }

        .topic-chip:hover,
        .topic-chip.active {
            background: #1f2940;
            color: #e8e9ec;
        }

        .search-wrap {
            width: min(820px, 100%);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #1f2940;
            padding-bottom: 6px;
        }

        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: #1f2940;
            font-size: clamp(18px, 2.2vw, 34px);
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.2;
        }

        .search-wrap input::placeholder {
            color: rgba(31, 41, 64, 0.45);
        }

        .search-icon {
            font-size: clamp(20px, 2.2vw, 36px);
            line-height: 1;
            color: #1f2940;
        }

        .results {
            width: min(980px, 100%);
            margin: 16px auto 52px;
            padding: 0 20px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .book-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(31, 41, 64, 0.32);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .book-card h3 {
            font-size: 18px;
            line-height: 1.3;
            margin-bottom: 2px;
        }

        .book-card p {
            font-family: 'Noto Sans KR', sans-serif;
            color: #404a63;
            font-size: 14px;
            line-height: 1.45;
        }

        .empty-state {
            grid-column: 1 / -1;
            font-family: 'Noto Sans KR', sans-serif;
            text-align: center;
            font-size: 16px;
            color: #404a63;
            padding: 20px;
            border: 1px dashed rgba(31, 41, 64, 0.45);
            border-radius: 12px;
            display: none;
        }

        @media (max-width: 820px) {
            .hero {
                min-height: 42vh;
            }

            .hero p {
                max-width: 650px;
            }

            .library-controls {
                padding-top: 34px;
            }

            .results {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <main class="library-page">
        <section class="hero">
            <h1>Library</h1>
            <p>is a platform for publishing, sharing and archiving syllabi.</p>
        </section>

        <hr class="divider">

        <section class="library-controls">
            <h2>Pick a topic to start browsing</h2>
            <div class="topic-row" id="topic-row"></div>
            <label class="search-wrap" for="keyword-input">
                <input id="keyword-input" type="search" placeholder="Or search for keywords..." autocomplete="off">
                <span class="search-icon" aria-hidden="true">&#9906;</span>
            </label>
        </section>

        <section class="results" id="results"></section>
        <div class="empty-state" id="empty-state">No results found. Try another topic or keyword.</div>
    </main>

    <script>
        const libraryItems = [
            {
                title: 'History of Publishing Commons',
                topic: 'History',
                keywords: ['archive', 'print', 'publishing', 'commons'],
                summary: 'A survey of collective publishing histories and grassroots archive methods.'
            },
            {
                title: 'Introduction to Open Syllabus Design',
                topic: 'Introduction',
                keywords: ['open', 'curriculum', 'intro', 'editing'],
                summary: 'How to draft, revise and circulate open syllabi with contributors.'
            },
            {
                title: 'Masters Seminar: Shared Research Methods',
                topic: "Master's",
                keywords: ['graduate', 'research', 'methods', 'collaboration'],
                summary: 'Advanced reading group format for co-authored investigations.'
            },
            {
                title: 'Designing Living Syllabi',
                topic: 'Design',
                keywords: ['design', 'typography', 'layout', 'web'],
                summary: 'Principles for creating adaptive, reusable and multilingual syllabus layouts.'
            },
            {
                title: 'Islamic Manuscript Cultures',
                topic: 'Islam',
                keywords: ['manuscript', 'islam', 'calligraphy', 'history'],
                summary: 'A focused guide to manuscript traditions and contemporary study practices.'
            },
            {
                title: 'Media Studies for Collective Practice',
                topic: 'Media Studies',
                keywords: ['media', 'platform', 'network', 'digital'],
                summary: 'Critical tools to read platforms, infrastructures and community media.'
            },
            {
                title: 'Archive Maintenance 101',
                topic: 'Introduction',
                keywords: ['metadata', 'catalog', 'maintenance', 'archive'],
                summary: 'Practical workflow for preserving and indexing syllabus collections.'
            },
            {
                title: 'Experimental Reading Rooms',
                topic: 'Design',
                keywords: ['space', 'facilitation', 'reading', 'community'],
                summary: 'Designing physical and online reading environments for group study.'
            }
        ];

        const topics = ['All', 'History', 'Introduction', "Master's", 'Design', 'Islam', 'Media Studies'];
        let activeTopic = 'All';

        const topicRow = document.getElementById('topic-row');
        const keywordInput = document.getElementById('keyword-input');
        const resultsContainer = document.getElementById('results');
        const emptyState = document.getElementById('empty-state');

        function createTopicChips() {
            topicRow.innerHTML = '';

            topics.forEach((topic) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'topic-chip';
                button.textContent = topic;

                if (topic === activeTopic) {
                    button.classList.add('active');
                }

                button.addEventListener('click', function() {
                    activeTopic = topic;
                    createTopicChips();
                    renderResults();
                });

                topicRow.appendChild(button);
            });
        }

        function renderResults() {
            const query = keywordInput.value.trim().toLowerCase();

            const matches = libraryItems.filter((item) => {
                const matchesTopic = activeTopic === 'All' || item.topic === activeTopic;
                const searchable = `${item.title} ${item.topic} ${item.keywords.join(' ')} ${item.summary}`.toLowerCase();
                const matchesKeyword = !query || searchable.includes(query);
                return matchesTopic && matchesKeyword;
            });

            resultsContainer.innerHTML = '';

            matches.forEach((item) => {
                const card = document.createElement('article');
                card.className = 'book-card';
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <p>${item.topic} | ${item.keywords.join(', ')}</p>
                    <p>${item.summary}</p>
                `;
                resultsContainer.appendChild(card);
            });

            emptyState.style.display = matches.length === 0 ? 'block' : 'none';
        }

        keywordInput.addEventListener('input', renderResults);

        createTopicChips();
        renderResults();
    </script>

</body>
</html>
