        <p>4.11. 2026<br>Subject: <br><br>쿠모에게, <br><br>제주도도 모계 사회야. 강한 여성들이 뿌리를 내리고 있고, 그 뿌리 위에서 많은 것들이 자라지. 나는 그들을 동경해 왔어. 아니, 사실 희생된 여성을 동경해 온 것 같아. 사회에서, 그리고 가정에서 희생당한 여성들 말이야. 그래서 항상 나만의 마녀회를 가지고 싶다는 꿈을 가지고 싶었어. 나는 마녀가 되고 싶었으니까.</p>
